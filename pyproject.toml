[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catapro-update-app"
version = "0.1.0"
description = "CataPro database update runner for raw_source, external_source, and manual_override workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "openpyxl",
  "xlrd",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.scripts]
catapro-update = "catapro_update_app.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
